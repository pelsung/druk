name = "druk-studio"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true   # the Worker answers at druk-studio.<account>.workers.dev (the share form and the dashboard use it)


[vars]
REPO = "pelsung/druk"
BRANCH = "main"
ALLOWED_ORIGIN = "*"   # set to the site's origin, e.g. "https://druk.help"

# Secrets — never put these in this file. Run from studio-api/, always with
# --config (the druk/ folder's own wrangler.jsonc would be picked otherwise):
#   npx wrangler secret put GITHUB_TOKEN --config wrangler.toml
#   npx wrangler secret put TURNSTILE_SECRET --config wrangler.toml   (optional, see README.md)

# ---- Editor dashboard (/admin/) ---------------------------------------------
SITE_ORIGIN = "https://druk.help"   # where "is it live yet?" looks
# (SITE_ORIGIN is also the only website allowed to call the dashboard API from a browser.)

# The editor's password is a SECRET (at least 12 characters), never written here:
#   npx wrangler secret put ADMIN_PASSWORD --config wrangler.toml

# Optional: record an activity log (also lists failed attempts). Create it with
#   npx wrangler kv namespace create AUDIT
# and uncomment:
# [[kv_namespaces]]
# binding = "AUDIT"
# id = "<the id printed by that command>"

